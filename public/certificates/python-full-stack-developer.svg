<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="20" fill="url(#gradBg)"/>
  
  <!-- Outer Border -->
  <rect x="24" y="24" width="752" height="512" rx="14" fill="none" stroke="#27272a" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="488" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Badge Icon -->
  <g transform="translate(400, 115)" filter="url(#shadow)">
    <circle r="44" fill="#1e1b4b" stroke="#6366f1" stroke-width="3"/>
    <path d="M-16 -10 L0 -24 L16 -10 L16 16 L0 26 L-16 16 Z" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-8 -2 L-2 4 L10 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Organization / Header -->
  <text x="400" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#a5b4fc" text-anchor="middle">UPCODE SOFTWARE LABS</text>
  <text x="400" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#71717a" text-anchor="middle">OFFICIAL VERIFIED CREDENTIAL</text>

  <!-- Title -->
  <text x="400" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" fill="#ffffff" text-anchor="middle">Python Full Stack Developer</text>

  <!-- Recipient -->
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a1a1aa" text-anchor="middle">Awarded to</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#e0e7ff" text-anchor="middle">SIBIN P</text>

  <!-- Divider -->
  <line x1="280" y1="388" x2="520" y2="388" stroke="#3f3f46" stroke-width="1"/>

  <!-- Details -->
  <text x="400" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">Python • Django REST Framework • React • PostgreSQL • Full Stack Systems</text>
  
  <text x="180" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#71717a" text-anchor="middle">Period: 12 Jan 2026 – 18 Sep 2026</text>
</svg>
